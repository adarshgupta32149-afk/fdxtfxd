<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    /* Full-bleed hero slideshow override — stack the hero, break the slider out
       to full viewport width, remove the frame/bezel (border, radius, shadow,
       corner brackets). */
    html, body { overflow-x: hidden; }
    .hero-in {
      grid-template-columns: 1fr !important;
      gap: 34px !important;
      min-height: 0 !important;
      align-items: start !important;
    }
    /* Slider banner pushed to the top; text sits below it. */
    .hero        { padding-top: 0 !important; }
    .hero-figure { order: -1 !important; gap: 20px; }
    .hero-copy   { order: 1 !important; }
    .hero-media {
      width: 100vw !important;
      margin-left: calc(50% - 50vw) !important;
      margin-right: calc(50% - 50vw) !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      aspect-ratio: auto !important;
      height: clamp(360px, 62vh, 640px) !important;
    }
    .hero-media .frame-corner { display: none !important; }
    /* Remove the slider overlay controls: image counter, nav dots, and the
       prev/next arrow buttons. */
    .slide-hud,
    .snav,
    .snav.prev,
    .snav.next { display: none !important; }

    /* Logo slide only: show the whole logo card (no crop/zoom) on the dark
       banner. The photographic hero slides keep their original full-bleed cover. */
    .slide img[src*="logo"] {
      object-fit: contain !important;
      transform: none !important;
      animation: none !important;
      padding: 24px !important;
      filter: drop-shadow(0 20px 36px rgba(0,0,0,.5));
    }
    /* Transparent jack photos on the product cards: float them on the dark
       card with a soft shadow instead of a white frame. */
    .detail-media img {
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      background: transparent !important;
      object-fit: contain !important;
      filter: drop-shadow(0 26px 40px rgba(0,0,0,.6));
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ORDER ONLINE section.
       The site is a pre-built React bundle (no source in this repo), so this
       section is built here and slotted into <main> just before #contact, with
       an "Order" link added to the header and mobile nav. It reuses the site's
       own classes (.section, .sec-head, .btn) and CSS variables. -->
  <style>
    .om-grid { display: grid; grid-template-columns: 1.5fr .9fr; gap: 22px; align-items: start; }
    .om-list { display: grid; gap: 10px; }
    .om-row {
      display: grid; grid-template-columns: 64px 1fr auto auto; align-items: center; gap: 16px;
      padding: 12px 16px; background: linear-gradient(180deg,#16294a,#101f38);
      border: 1px solid var(--line-soft); border-left: 3px solid transparent; border-radius: 6px;
      transition: border-color .22s ease, background .22s ease;
    }
    .om-row.on { border-left-color: var(--orange); border-color: #ff6b2b73; background: linear-gradient(180deg,#ff6b2b21,#ff6b2b08); }
    .om-thumb { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.5)); }
    .om-code { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); }
    .om-code em { font-style: normal; color: var(--orange); font-size: 13px; margin-left: 8px; letter-spacing: .06em; }
    .om-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .om-price { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink); }
    .om-price small { display: block; font-family: var(--body); font-weight: 500; font-size: 11px; color: var(--muted); }
    .om-qty { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .om-qty button { width: 38px; height: 40px; border: 0; background: #ffffff0a; color: var(--ink); font-size: 18px; font-weight: 600; cursor: pointer; }
    .om-qty button:hover { background: #ff6b2b33; }
    .om-qty input { width: 46px; height: 40px; border: 0; background: transparent; color: var(--ink); text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px; -moz-appearance: textfield; }
    .om-qty input::-webkit-outer-spin-button, .om-qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .om-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

    .om-side { position: sticky; top: 96px; background: linear-gradient(180deg,#13264373,#0f203866), var(--panel-2); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 22px; }
    .om-side h3 { font-family: var(--display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    .om-line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed var(--line-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
    .om-line span:first-child { color: var(--muted); }
    .om-empty { font-size: 13.5px; color: var(--muted); padding: 10px 0 14px; }
    .om-total { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 4px; padding-top: 14px; border-top: 1px solid var(--line); }
    .om-total span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .om-total b { font-family: var(--display); font-size: 30px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .om-pay { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
    .om-pay span { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .08em; color: var(--orange); border: 1.5px solid rgba(255,107,43,.55); background: #ff6b2b12; border-radius: 4px; padding: 6px 10px; }
    .om-side .btn { width: 100%; margin-top: 10px; }
    .om-side .btn.om-off { opacity: .45; pointer-events: none; }
    .om-upi { margin: 16px 0 0; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: var(--ink); border: 1px solid rgba(46,160,90,.4); background: rgba(46,160,90,.08); border-radius: 6px; }
    .om-upi a { color: #b8f3c9; font-weight: 600; }

    @media (max-width: 900px) { .om-grid { grid-template-columns: 1fr; } .om-side { position: static; } }
    @media (max-width: 560px) {
      .om-row { grid-template-columns: 52px 1fr auto; gap: 4px 12px; padding: 12px; }
      .om-thumb { width: 52px; height: 52px; grid-row: 1 / span 2; }
      .om-price { grid-column: 2; text-align: left; }
      .om-price small { display: inline; margin-left: 6px; }
      .om-qty { grid-column: 3; grid-row: 1 / span 2; }
      .om-qty button { width: 32px; }
      .om-qty input { width: 34px; }
      .om-code em { font-size: 12px; margin-left: 6px; white-space: nowrap; }
    }
  </style>
  <script>
  (function () {
    var PRODUCTS = [
      { code: "AHS-015", ton: 15,  lift: 110, rod: 40, price: 2950, pack: 6, img: "images/ahs-015.png" },
      { code: "AHS-035", ton: 35,  lift: 110, rod: 50, price: 4100, pack: 4, img: "images/ahs-035.png" },
      { code: "AHS-060", ton: 60,  lift: 140, rod: 54, price: 6050, pack: 2, img: "images/ahs-060.png" },
      { code: "AHS-090", ton: 90,  lift: 145, rod: 63, price: 6900, pack: 2, img: "images/ahs-090.png" },
      { code: "AHS-120", ton: 120, lift: 150, rod: 73, price: 8400, pack: 1, img: "images/ahs-120.png" }
    ];
    var WHATSAPP = "918090688246";
    var INR = function (n) { return "₹" + n.toLocaleString("en-IN"); };
    var qty = {};
    PRODUCTS.forEach(function (p) { qty[p.code] = 0; });

    // ---- build the section once ----
    var section = document.createElement("section");
    section.className = "section";
    section.id = "order";
    section.innerHTML =
      '<div class="wrap">' +
        '<div class="sec-head"><span class="sec-idx">05</span><div>' +
          '<p class="sec-kicker">Order Online</p>' +
          '<h2 class="sec-title">Build your order. Pay by bank transfer.</h2>' +
          '<p class="sec-sub">Set the quantities you need, check the total, then head to checkout and pay by NEFT, IMPS or RTGS.</p>' +
        '</div></div>' +
        '<div class="om-grid">' +
          '<div><div class="om-list">' +
            PRODUCTS.map(function (p) {
              return '<div class="om-row" data-code="' + p.code + '">' +
                '<img class="om-thumb" src="' + p.img + '" alt="' + p.code + ' ' + p.ton + ' ton jack" loading="lazy">' +
                '<div><div class="om-code">' + p.code + '<em>' + p.ton + ' TON</em></div>' +
                  '<div class="om-meta">Lift ' + p.lift + ' mm · Rod Ø' + p.rod + ' · Pack of ' + p.pack + '</div></div>' +
                '<div class="om-price">' + INR(p.price) + '<small>per unit</small></div>' +
                '<div class="om-qty">' +
                  '<button type="button" data-step="-1" aria-label="Fewer ' + p.code + '">−</button>' +
                  '<input type="number" min="0" value="0" inputmode="numeric" aria-label="' + p.code + ' quantity">' +
                  '<button type="button" data-step="1" aria-label="More ' + p.code + '">+</button>' +
                '</div></div>';
            }).join("") +
          '</div><p class="om-note">Prices ex-works Lucknow, excluding GST and freight.</p></div>' +
          '<aside class="om-side">' +
            '<h3>Your order</h3>' +
            '<div id="om-lines"></div>' +
            '<div class="om-total"><span>Total (excl. GST)</span><b id="om-total">₹0</b></div>' +
            '<div class="om-pay"><span>NEFT</span><span>IMPS</span><span>RTGS</span></div>' +
            '<a class="btn btn-primary om-off" id="om-checkout" href="payment.html" aria-disabled="true">Continue to checkout</a>' +
            '<a class="btn btn-ghost" href="orders.html">View my orders</a>' +
            '<p class="om-upi">If you would like to pay via UPI, please contact our ' +
              '<a href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent("Hi Automech, I'd like to pay via UPI. Please share your UPI details.") +
              '" target="_blank" rel="noreferrer">WhatsApp contact</a>.</p>' +
          '</aside>' +
        '</div>' +
      '</div>';

    function render() {
      var items = PRODUCTS.filter(function (p) { return qty[p.code] > 0; });
      var total = items.reduce(function (s, p) { return s + p.price * qty[p.code]; }, 0);
      section.querySelector("#om-lines").innerHTML = items.length
        ? items.map(function (p) {
            return '<div class="om-line"><span>' + p.code + ' × ' + qty[p.code] + '</span><span>' + INR(p.price * qty[p.code]) + '</span></div>';
          }).join("")
        : '<p class="om-empty">Nothing added yet. Use + to add jacks.</p>';
      section.querySelector("#om-total").textContent = INR(total);
      var btn = section.querySelector("#om-checkout");
      btn.classList.toggle("om-off", !items.length);
      btn.setAttribute("aria-disabled", String(!items.length));
      // hand the cart to the checkout page in the URL
      btn.href = "payment.html" + (items.length
        ? "?cart=" + items.map(function (p) { return p.code + ":" + qty[p.code]; }).join(",")
        : "");
    }
    function setQty(code, v) {
      v = Math.max(0, parseInt(v, 10) || 0);
      qty[code] = v;
      var row = section.querySelector('.om-row[data-code="' + code + '"]');
      row.querySelector("input").value = v;
      row.classList.toggle("on", v > 0);
      render();
    }
    section.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-step]");
      if (!b) return;
      var code = b.closest(".om-row").dataset.code;
      setQty(code, qty[code] + Number(b.dataset.step));
    });
    section.addEventListener("change", function (e) {
      if (e.target.matches(".om-qty input")) setQty(e.target.closest(".om-row").dataset.code, e.target.value);
    });
    render();

    // ---- slot it into the React-rendered page (idempotent; re-run if React re-renders) ----
    var hazard = document.createElement("div");
    hazard.className = "hazard";

    function goToOrder(smooth) {
      section.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    }
    function navLink(html) {
      var a = document.createElement("a");
      a.href = "#order";
      a.setAttribute("data-om", "");
      a.innerHTML = html;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        // The mobile menu locks page scroll while open: close it first (as the
        // site's own links do), then scroll once the lock is released.
        var burger = document.querySelector(".burger[aria-expanded='true']");
        if (burger) burger.click();
        setTimeout(function () { goToOrder(true); }, burger ? 320 : 0);
        history.replaceState(null, "", "#order");
      });
      return a;
    }
    // Text may be one node ("05") or two ("0","5") depending on how React rendered it.
    function bump05to06(el) {
      if (el && el.textContent === "05" && el.lastChild) el.lastChild.nodeValue = el.lastChild.nodeValue.replace("5", "6");
    }
    var placed = false;
    function ensure() {
      var main = document.querySelector("#root main");
      var contact = document.getElementById("contact");
      if (!main || !contact) return;

      if (!section.isConnected) { main.insertBefore(section, contact); main.insertBefore(hazard, contact); }

      // Order takes index 05, so Contact becomes 06
      bump05to06(contact.querySelector(".sec-idx"));

      var nav = document.querySelector(".site-head .nav");
      if (nav && !nav.querySelector("[data-om]")) {
        nav.insertBefore(navLink("Order"), nav.querySelector('a[href="#contact"]'));
      }
      var mnav = document.querySelector(".mnav");
      if (mnav && !mnav.querySelector("[data-om]")) {
        var mContact = mnav.querySelector('a[href="#contact"]');
        mnav.insertBefore(navLink("<em>05</em>Order Online"), mContact);
        bump05to06(mContact && mContact.querySelector("em"));
      }

      // Arriving on index.html#order (e.g. "Back to site" from checkout): the section
      // did not exist when the browser tried the hash, so scroll to it now.
      if (!placed) {
        placed = true;
        if (location.hash === "#order") {
          requestAnimationFrame(function () { goToOrder(false); });
          window.addEventListener("load", function () { goToOrder(false); });
        }
      }
    }
    new MutationObserver(ensure).observe(document.getElementById("root"), { childList: true, subtree: true });
    ensure();
  })();
  </script>

  <!-- Netlify Forms: static copy so the build-time bot registers the "enquiry" form.
       The live form is rendered by React and posts to this. -->
  <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="enquiry" />
    <input type="text" name="name" />
    <input type="text" name="phone" />
    <input type="text" name="model" />
    <input type="number" name="qty" />
    <textarea name="message"></textarea>
    <input type="text" name="bot-field" />
  </form>

</body>
</html>
